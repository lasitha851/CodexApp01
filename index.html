<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Income & Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Income & Expense Tracker</h1>
        <p class="subtitle">Track entries, review balances, and filter by category or date.</p>
      </div>
      <div class="balance-card">
        <span class="balance-label">Balance</span>
        <strong id="balance">$0.00</strong>
      </div>
    </header>

    <main>
      <section class="summary">
        <div class="summary-card income">
          <span>Total Income</span>
          <strong id="total-income">$0.00</strong>
        </div>
        <div class="summary-card expense">
          <span>Total Expense</span>
          <strong id="total-expense">$0.00</strong>
        </div>
      </section>

      <section class="panel">
        <h2 id="form-title">Add Entry</h2>
        <form id="entry-form">
          <input type="hidden" id="entry-id" />
          <div class="field-group">
            <label for="type">Type *</label>
            <select id="type" required>
              <option value="">Select type</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="field-group">
            <label for="amount">Amount *</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
          <div class="field-group">
            <label for="date">Date *</label>
            <input id="date" type="date" required />
          </div>
          <div class="field-group">
            <label for="category">Category *</label>
            <input id="category" type="text" placeholder="Salary, Rent, Groceries" required />
          </div>
          <div class="field-group">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-button">Add Entry</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Filters</h2>
        <div class="filters">
          <div class="field-group">
            <label for="filter-start">Start Date</label>
            <input id="filter-start" type="date" />
          </div>
          <div class="field-group">
            <label for="filter-end">End Date</label>
            <input id="filter-end" type="date" />
          </div>
          <div class="field-group">
            <label for="filter-category">Category</label>
            <input id="filter-category" type="text" placeholder="All categories" />
          </div>
          <button id="clear-filters" class="secondary" type="button">Clear Filters</button>
        </div>
      </section>

      <section class="panel">
        <h2>Entries</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category</th>
                <th>Notes</th>
                <th class="amount-col">Amount</th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="entry-list"></tbody>
          </table>
        </div>
        <p class="empty-state" id="empty-state">No entries yet. Add your first income or expense above.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
